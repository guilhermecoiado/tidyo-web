<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A3D35" />
    <title>Tidyo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@500;600;700;800&display=swap" />
    <style>
      #splash { display: none; }
      @media (display-mode: standalone) { #splash { display: flex; } }
      html.standalone #splash { display: flex; }
      #splash { position: fixed; inset: 0; z-index: 100; background: #0A3D35; align-items: center; justify-content: center; flex-direction: column; gap: 18px; transition: opacity .35s ease, visibility .35s; }
      #splash.out { opacity: 0; visibility: hidden; }
      #splash .tile { animation: sp-tile .55s cubic-bezier(.2,.9,.3,1.25) both; transform-origin: center; }
      #splash .cap { animation: sp-drop .5s .28s cubic-bezier(.2,.9,.3,1.2) both; }
      #splash .stem { stroke-dasharray: 60; stroke-dashoffset: 60; animation: sp-draw .55s .5s ease-out forwards; }
      #splash .glow { animation: sp-glow 1.1s .9s ease-out both; transform-origin: 50px 14px; transform-box: view-box; }
      #splash .word { font: 800 30px/1 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing: -0.035em; color: #EAF5F2; animation: sp-up .45s .7s ease-out both; }
      #splash .by { font: 700 12px/1 Manrope, system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #5FD4C1; opacity: .85; animation: sp-up .45s .9s ease-out both; margin-top: -8px; }
      @keyframes sp-tile { from { transform: scale(.4) rotate(-12deg); opacity: 0; } }
      @keyframes sp-drop { from { transform: translateY(-14px); opacity: 0; } }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-glow { 0% { transform: scale(0); opacity: 0; } 40% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
      @keyframes sp-up { from { transform: translateY(8px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; stroke-dashoffset: 0 !important; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="tile" width="96" height="96" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="17" fill="#D4F1E9" />
        <g transform="translate(11 8.5) scale(0.7)">
          <g class="cap">
            <rect x="12" y="9.5" width="36" height="4" rx="2" fill="#12A38F" />
            <rect x="10" y="12.5" width="40" height="10" rx="5" fill="#0A3D35" />
          </g>
          <path class="stem" d="M30 20 V 44 C 30 51.5, 34 55, 41.5 54" fill="none" stroke="#0A3D35" stroke-width="7" stroke-linecap="round" />
        </g>
        <path class="glow" d="M50 8l1.4 3.4 3.4 1.4-3.4 1.4L50 17.6l-1.4-3.4-3.4-1.4 3.4-1.4z" fill="#12A38F" />
      </svg>
      <span class="word">tidyo</span>
      <span class="by">by YEHI</span>
    </div>
    <script>
      if (navigator.standalone === true) document.documentElement.classList.add('standalone');
      window.__splashAt = Date.now();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
